{% extends "layout.html" %}

{% block title %}SUN68 - Trang chủ{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="card p-4">
                <h3 class="text-center text-gold">
                    <i class="fas fa-dice"></i> BÀN TÀI XỈU SUN68
                </h3>
                
                <div id="result-display" class="result-box result-pending text-center">
                    <span id="result-text">ĐANG CHỜ...</span>
                    <br>
                    <small class="text-muted" id="hash-display">Hash: Đang tạo...</small>
                </div>

                <div class="row mt-3">
                    <div class="col-6">
                        <button class="btn btn-red bet-btn" onclick="placeBet('TAI')">
                            <i class="fas fa-arrow-up"></i> TÀI
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="btn bet-btn" onclick="placeBet('XIU')" style="background: linear-gradient(135deg, #0000cc, #0066ff); color: white;">
                            <i class="fas fa-arrow-down"></i> XỈU
                        </button>
                    </div>
                </div>

                <div class="row mt-3">
                    <div class="col-md-6 mx-auto">
                        <div class="input-group">
                            <span class="input-group-text bg-dark text-gold">Số tiền</span>
                            <input type="number" id="bet-amount" class="form-control" value="10000" min="1000">
                            <button class="btn btn-outline-gold" onclick="setBetAmount(10000)">10k</button>
                            <button class="btn btn-outline-gold" onclick="setBetAmount(50000)">50k</button>
                            <button class="btn btn-outline-gold" onclick="setBetAmount(100000)">100k</button>
                        </div>
                    </div>
                </div>

                <div class="mt-4">
                    <h5 class="text-gold"><i class="fas fa-history"></i> Lịch sử 50 phiên</h5>
                    <div id="history-container" class="d-flex flex-wrap">
                        {% for round in history %}
                            <span class="history-item-{{ 'tai' if round.result == 'TAI' else 'xiu' }}">
                                {{ 'T' if round.result == 'TAI' else 'X' }}
                            </span>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .text-gold { color: #d4af37; }
    .btn-outline-gold {
        color: #d4af37;
        border-color: #d4af37;
    }
    .btn-outline-gold:hover {
        background: #d4af37;
        color: #1a0505;
    }
    .result-box {
        padding: 25px;
        border-radius: 15px;
        text-align: center;
        font-size: 2.5rem;
        font-weight: bold;
        margin: 20px 0;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        transition: all 0.5s;
    }
    .result-tai {
        background: linear-gradient(135deg, #8b0000, #cc0000);
        border: 2px solid #ff4444;
        animation: pulse-red 1s infinite;
    }
    .result-xiu {
        background: linear-gradient(135deg, #0a0a8b, #0000cc);
        border: 2px solid #4444ff;
        animation: pulse-blue 1s infinite;
    }
    .result-pending {
        background: linear-gradient(135deg, #2d2d2d, #4d4d4d);
        border: 2px solid #888888;
    }
    @keyframes pulse-red {
        0% { box-shadow: 0 0 20px rgba(255, 0, 0, 0.5); }
        50% { box-shadow: 0 0 40px rgba(255, 0, 0, 0.8); }
        100% { box-shadow: 0 0 20px rgba(255, 0, 0, 0.5); }
    }
    @keyframes pulse-blue {
        0% { box-shadow: 0 0 20px rgba(0, 0, 255, 0.5); }
        50% { box-shadow: 0 0 40px rgba(0, 0, 255, 0.8); }
        100% { box-shadow: 0 0 20px rgba(0, 0, 255, 0.5); }
    }
    .history-item-tai {
        background: #cc0000;
        color: white;
        padding: 5px 12px;
        border-radius: 5px;
        display: inline-block;
        margin: 2px;
        width: 40px;
        text-align: center;
        font-weight: bold;
    }
    .history-item-xiu {
        background: #0000cc;
        color: white;
        padding: 5px 12px;
        border-radius: 5px;
        display: inline-block;
        margin: 2px;
        width: 40px;
        text-align: center;
        font-weight: bold;
    }
    .bet-btn {
        width: 100%;
        padding: 20px;
        font-size: 1.5rem;
        font-weight: bold;
        border-radius: 15px;
        transition: all 0.3s;
    }
    .bet-btn:hover {
        transform: scale(1.05);
    }
    .btn-red {
        background: linear-gradient(135deg, #8b0000, #cc0000);
        color: white;
        font-weight: bold;
        border: none;
    }
</style>

<script>
    function placeBet(type) {
        let amount = parseInt(document.getElementById('bet-amount').value);
        if (amount <= 0) {
            alert('Vui lòng nhập số tiền hợp lệ');
            return;
        }

        fetch('/api/bet', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ bet_type: type, bet_amount: amount })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('✅ ' + data.message);
                document.getElementById('user-balance').textContent = data.new_balance;
            } else {
                alert('❌ ' + data.error);
            }
        })
        .catch(error => alert('❌ Lỗi hệ thống'));
    }

    function setBetAmount(amount) {
        document.getElementById('bet-amount').value = amount;
    }

    // Auto update game
    function updateGame() {
        fetch('/api/round_result')
        .then(response => response.json())
        .then(data => {
            if (data.result) {
                let resultClass = data.result === 'TAI' ? 'result-tai' : 'result-xiu';
                let resultText = data.result === 'TAI' ? '🔴 TÀI' : '🔵 XỈU';
                
                let display = document.getElementById('result-display');
                display.className = 'result-box ' + resultClass;
                document.getElementById('result-text').textContent = resultText;
                document.getElementById('hash-display').textContent = `🔒 Hash: ${data.hash_md5.substring(0, 16)}...`;
            }

            if (data.history) {
                let html = '';
                data.history.forEach(function(item) {
                    let cls = item.result === 'TAI' ? 'history-item-tai' : 'history-item-xiu';
                    let txt = item.result === 'TAI' ? 'T' : 'X';
                    html += `<span class="${cls}">${txt}</span>`;
                });
                document.getElementById('history-container').innerHTML = html;
            }
        })
        .catch(error => console.error('Lỗi update:', error));
    }

    // Update mỗi 5 giây
    setInterval(updateGame, 5000);
    updateGame();
</script>
{% endblock %}
