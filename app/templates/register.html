{% extends "base.html" %}

{% block title %}Đăng ký{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card-sun p-4">
            <h3 class="text-center text-gold mb-4">
                <i class="fas fa-user-plus"></i> Đăng ký SUN68
            </h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label text-light">Tên đăng nhập</label>
                    <input type="text" name="username" class="form-control bg-dark text-light border-secondary" required minlength="4">
                    <small class="text-muted">Ít nhất 4 ký tự</small>
                </div>
                <div class="mb-3">
                    <label class="form-label text-light">Tên hiển thị</label>
                    <input type="text" name="display_name" class="form-control bg-dark text-light border-secondary">
                </div>
                <div class="mb-3">
                    <label class="form-label text-light">Mật khẩu</label>
                    <input type="password" name="password" class="form-control bg-dark text-light border-secondary" required minlength="6">
                    <small class="text-muted">Ít nhất 6 ký tự</small>
                </div>
                <div class="mb-3">
                    <label class="form-label text-light">Xác nhận mật khẩu</label>
                    <input type="password" name="confirm_password" class="form-control bg-dark text-light border-secondary" required>
                </div>
                <button type="submit" class="btn-gold w-100 py-2">Đăng ký</button>
            </form>
            <div class="text-center mt-3">
                <a href="{{ url_for('login') }}" class="text-gold" style="text-decoration:none;">
                    Đã có tài khoản? Đăng nhập
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
