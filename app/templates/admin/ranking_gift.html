{% extends "admin/layout_admin.html" %}

{% block admin_title %}Ranking Gift{% endblock %}

{% block admin_content %}
<div class="card">
    <div class="card-header">
        <h5>Trao thưởng xếp hạng SUN68</h5>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-4">
                    <label class="form-label">Loại xếp hạng</label>
                    <select name="rank_type" class="form-control" required>
                        <option value="top_deposit">Top nạp</option>
                        <option value="top_bet">Top cược</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Kỳ</label>
                    <select name="rank_period" class="form-control" required>
                        <option value="daily">Ngày</option>
                        <option value="monthly">Tháng</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Số tiền thưởng</label>
                    <input type="number" name="amount" class="form-control" placeholder="Ví dụ: 100000" required>
                    <small>Top 1 nhận 100%, top 2 90%, top 3 80%...</small>
                </div>
            </div>
            <button type="submit" class="btn btn-gold mt-3">Trao thưởng SUN68</button>
        </form>
    </div>
</div>
{% endblock %}
