{% extends "base.html" %}

{% block title %}Đăng nhập{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card-sun p-4">
            <h3 class="text-center text-gold mb-4">
                <i class="fas fa-sign-in-alt"></i> Đăng nhập SUN68
            </h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label text-light">Tên đăng nhập</label>
                    <input type="text" name="username" class="form-control bg-dark text-light border-secondary" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-light">Mật khẩu</label>
                    <input type="password" name="password" class="form-control bg-dark text-light border-secondary" required>
                </div>
                <button type="submit" class="btn-gold w-100 py-2">Đăng nhập</button>
            </form>
            <div class="text-center mt-3">
                <a href="{{ url_for('register') }}" class="text-gold" style="text-decoration:none;">
                    Chưa có tài khoản? Đăng ký
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
